services:
  postgres:
    image: postgres:18.6
    container_name: kmeme-db
    restart: always
    env_file:
      - .env
    ports:
      - "100.109.34.104:5431:5432"
    volumes:
      - ./db:/var/lib/postgresql

  koishi-meme:
    image: oven/bun:1.3.14
    container_name: kmeme-app
    restart: always
    env_file:
      - .env
    working_dir: /app
    # 只挂载运行需要的文件: .env (由 env_file 注入) 和 ./db (postgres 数据) 不进 app 容器
    volumes:
      - ./src:/app/src:ro
      - ./node_modules:/app/node_modules:ro
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./public:/app/public
    depends_on:
      - postgres
    command: bun run start
    ulimits:
      core:
        soft: 0
        hard: 0
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kmeme.rule=Host(`kmeme.itzdrli.cc`)"
      - "traefik.http.routers.kmeme.entrypoints=websecure"
      - "traefik.http.routers.kmeme.tls=true"
      - "traefik.http.routers.kmeme.tls.certresolver=cf"
      - "traefik.http.services.kmeme.loadbalancer.server.port=3060"

networks:
  proxy:
    external: true
